# The tests, with the four assemblers checked out beside this repository as they are locally: assembler-python
# run through uv, assembler-typescript built so the link: dependency resolves, and assembler-go and assembler-rust
# built into bin/ by pnpm run setup, which fails unless all four adapters are available. Each assembler is at its
# main, except when release.yml runs it for a tag: then the demo and all four assemblers are at that tag.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; release.yml passes the tag
        type: string
        default: ""
      assemblers_ref:
        description: The ref of each assembler to test against; release.yml passes the same tag
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    name: pnpm test against the four assemblers (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: assembler-demo
      # A push or pull request passes no inputs, so the assemblers fall back to main.
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/assembler-python
          ref: ${{ inputs.assemblers_ref || 'main' }}
          path: assembler-python
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/assembler-typescript
          ref: ${{ inputs.assemblers_ref || 'main' }}
          path: assembler-typescript
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/assembler-go
          ref: ${{ inputs.assemblers_ref || 'main' }}
          path: assembler-go
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/assembler-rust
          ref: ${{ inputs.assemblers_ref || 'main' }}
          path: assembler-rust
      # The version comes from packageManager in the demo's package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: assembler-demo/package.json
      # Node 24, as in the Containerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            assembler-demo/pnpm-lock.yaml
            assembler-typescript/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: assembler-go/go.mod
      # Stable Rust, as the crate's own ci installs it; pnpm run setup builds its adapter example.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: astral-sh/setup-uv@v6
      - name: build the TypeScript assembler the demo links
        working-directory: assembler-typescript
        run: pnpm install --frozen-lockfile && pnpm run build
      - working-directory: assembler-demo
        run: pnpm install --frozen-lockfile
      - working-directory: assembler-demo
        run: pnpm run setup
      - working-directory: assembler-demo
        run: pnpm test
