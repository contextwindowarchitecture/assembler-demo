<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWA demo · intermediate</title>
  <link rel="stylesheet" href="../style.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('cwa-theme') === 'dark' ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <header class="top">
    <div class="masthead">
      <div class="brandrow">
        <a class="brand" href="../"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>CWA</a>
        <span class="brand-sub">support-assistant demo</span>
      </div>
      <div id="stages"></div>
      <div class="masthead-right">
        <button id="tour-toggle" type="button" aria-pressed="false" hidden>Take the tour</button>
        <button id="talk" type="button" aria-pressed="false" title="larger type for a projector; folds the instruments behind one line">Talk mode</button>
        <button id="theme" type="button" aria-label="Toggle color theme" title="light or dark; remembered per browser">dark</button>
        <button id="glossary-toggle" type="button" aria-expanded="false" aria-controls="glossary" title="what the words mean; Esc closes">glossary</button>
      </div>
    </div>
    <div class="stepband">
      <nav class="steps" id="steps" aria-label="Scenario steps"></nav>
      <span id="agreement" class="badges" data-tour="agreement"></span>
    </div>
    <div class="instruments" id="instruments">
      <button class="instruments-toggle" id="instruments-toggle" type="button" aria-expanded="false" aria-controls="controls">Instruments <span class="mono" id="instruments-summary"></span></button>
      <div class="controls" id="controls">
        <label class="field" data-tour="instruments:mode">Producers
          <span class="select"><select id="mode">
            <option value="replay">replay the frozen batches</option>
            <option value="live">run live now</option>
          </select></span>
        </label>
        <label class="field">Assembler
          <span class="select"><select id="assembler"></select></span>
        </label>
        <label class="field" data-tour="instruments:variant">Rendering
          <span class="select"><select id="variant">
            <option value="fixture">fixture-xml/v1 (compare)</option>
            <option value="messages">cwa-messages/v1 (model)</option>
          </select></span>
        </label>
        <label class="field" data-tour="instruments:budget">budget.input
          <span class="number"><input id="budget" type="number" min="0" step="10" inputmode="numeric"></span>
        </label>
        <button id="reset" type="button" title="Back to the frozen snapshot's budget">frozen</button>
        <span class="hint">← → switch steps</span>
      </div>
    </div>
    <section class="tour" id="tour" hidden aria-label="Guided tour" aria-live="polite"></section>
  </header>

  <aside class="glossary" id="glossary" hidden aria-labelledby="glossary-title">
    <div class="glossary-head">
      <span class="label" id="glossary-title">Glossary</span>
      <input id="glossary-filter" type="text" placeholder="filter" aria-label="Filter the glossary" autocomplete="off" spellcheck="false">
      <button id="glossary-close" type="button">Close</button>
    </div>
    <div class="glossary-body" id="glossary-body"></div>
  </aside>


  <section class="scenario" id="scenario" data-tour="scenario"></section>
  <section class="producers-strip" id="producers" data-tour="producers"></section>
  <section class="delta" id="delta" data-tour="delta" aria-label="What changed since the previous step"></section>

  <main class="columns" data-tour="columns">
    <section class="column" id="candidates" data-tour="col:candidates"><h2><span class="num">1</span><span class="col-title">Candidate context</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="decisions" data-tour="col:decisions"><h2><span class="num">2</span><span class="col-title">CWA decisions</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="request" data-tour="col:request"><h2><span class="num">3</span><span class="col-title">Outbound request</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="answer" data-tour="col:answer"><h2><span class="num">4</span><span class="col-title">Model answer</span><span class="col-sub"></span></h2><div class="body"></div></section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script type="module" src="page.js"></script>
</body>
</html>
