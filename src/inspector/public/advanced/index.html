<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWA demo · advanced</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <a class="brand-name" href="/">CWA</a>
      <span class="brand-sub">advanced · a bounded tool loop: every inference a snapshot, every tool call authorized outside the model</span>
    </div>
    <div id="stages"></div>
    <div class="controls">
      <label>Recorded run
        <select id="run"></select>
      </label>
      <label>Scenario
        <select id="scenario"></select>
      </label>
      <label>Provider
        <select id="provider"></select>
      </label>
      <button class="primary" id="start" type="button" title="run the controller now against the chosen model and record it">Run live</button>
      <button id="replay" type="button" title="every recorded inference through all three assemblers">Replay through all three</button>
      <span id="agreement" class="badge"></span>
    </div>
  </header>

  <section class="scenario" id="scenario-head"></section>
  <section class="timeline" id="timeline"></section>

  <main class="columns">
    <section class="column" id="candidates"><h2>Candidate context</h2><div class="body"></div></section>
    <section class="column" id="decisions"><h2>CWA decisions</h2><div class="body"></div></section>
    <section class="column" id="request"><h2>Outbound request</h2><div class="body"></div></section>
    <section class="column" id="answer"><h2>Model response</h2><div class="body"></div></section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script type="module" src="/advanced/page.js"></script>
</body>
</html>
