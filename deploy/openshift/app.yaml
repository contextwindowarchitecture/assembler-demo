# The CWA demo inspector on OpenShift.
# Apply with deploy/openshift/deploy.sh, which substitutes the image and creates the Secret cwa-demo-env (the
# variables .env.example lists) beforehand; the Secret is never written from here.
apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: cwa-demo-app
    labels:
      app: cwa-demo-app
  spec:
    # One replica: a live agent run is recorded on the pod's own disk and listed from there, and that disk is not
    # kept, so live runs last as long as the pod. The reference runs are in the image.
    replicas: 1
    selector:
      matchLabels:
        app: cwa-demo-app
    template:
      metadata:
        labels:
          app: cwa-demo-app
      spec:
        containers:
        - name: inspector
          image: IMAGE_PLACEHOLDER
          # A rebuilt -dirty tag keeps its name: pull it every time.
          imagePullPolicy: Always
          ports:
          - containerPort: 8787
          env:
          - name: PORT
            value: "8787"
          envFrom:
          - secretRef:
              name: cwa-demo-env
          # The landing page is a static file: the probe runs no assembler and asks no model.
          readinessProbe:
            httpGet: { path: /, port: 8787 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8787 }
            initialDelaySeconds: 10
            periodSeconds: 20
          # An assembly runs the three adapters at once; a live producer run imports LlamaIndex.
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
- apiVersion: v1
  kind: Service
  metadata:
    name: cwa-demo-app
  spec:
    selector:
      app: cwa-demo-app
    ports:
    - name: http
      port: 8787
      targetPort: 8787
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: cwa-demo-app
    annotations:
      # An agent run against a model takes minutes; keep the router from cutting the request.
      haproxy.router.openshift.io/timeout: 10m
  spec:
    to:
      kind: Service
      name: cwa-demo-app
    port:
      targetPort: http
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
