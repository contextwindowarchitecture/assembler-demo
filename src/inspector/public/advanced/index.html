<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWA demo · advanced</title>
  <link rel="stylesheet" href="/style.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('cwa-theme') === 'dark' ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <header class="top">
    <div class="masthead">
      <a class="brand" href="/">CWA</a>
      <span class="brand-sub">support-assistant demo</span>
      <div id="stages"></div>
      <div class="masthead-right">
        <button id="talk" type="button" aria-pressed="false" title="larger type for a projector; folds the instruments behind one line">Talk mode</button>
        <button id="theme" type="button" aria-label="Toggle color theme" title="light or dark; remembered per browser">dark</button>
      </div>
    </div>
    <div class="stepband">
      <nav class="steps" id="steps" aria-label="Turns of the run"></nav>
      <span id="agreement" class="badges"></span>
    </div>
  </header>

  <div class="instruments" id="instruments">
    <button class="instruments-toggle" id="instruments-toggle" type="button" aria-expanded="false" aria-controls="controls">Instruments <span class="mono" id="instruments-summary"></span></button>
    <div class="controls" id="controls">
      <label>Recorded run
        <select id="run"></select>
      </label>
      <label>Scenario
        <select id="scenario"></select>
      </label>
      <label>Route
        <select id="route"></select>
      </label>
      <label>Provider
        <select id="provider"></select>
      </label>
      <button class="primary" id="start" type="button" title="run the controller now against the chosen model and record it">Run live</button>
      <button id="replay" type="button" title="every recorded inference through all three assemblers">Replay through all three</button>
      <span class="hint">← → switch turns</span>
    </div>
  </div>

  <section class="scenario" id="scenario-head"></section>
  <section class="routes" id="routes"></section>
  <section class="timeline" id="timeline"></section>
  <section class="delta" id="delta" aria-label="What changed since the previous turn"></section>

  <main class="columns">
    <section class="column" id="candidates"><h2><span class="num">1</span><span class="col-title">Candidate context</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="decisions"><h2><span class="num">2</span><span class="col-title">CWA decisions</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="request"><h2><span class="num">3</span><span class="col-title">Outbound request</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="answer"><h2><span class="num">4</span><span class="col-title">Model response</span><span class="col-sub"></span></h2><div class="body"></div></section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script type="module" src="/advanced/page.js"></script>
</body>
</html>
