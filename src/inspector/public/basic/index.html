<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWA demo · basic</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="masthead">
      <a class="brand" href="/">CWA</a>
      <span class="brand-sub">support-assistant demo</span>
      <div id="stages"></div>
      <div class="masthead-right">
        <button id="talk" type="button" aria-pressed="false" title="larger type for a projector; folds the instruments behind one line">Talk mode</button>
      </div>
    </div>
    <div class="stepband">
      <nav class="steps" id="steps" aria-label="Scenario steps"></nav>
      <span id="agreement" class="badges"></span>
    </div>
  </header>

  <div class="instruments" id="instruments">
    <button class="instruments-toggle" id="instruments-toggle" type="button" aria-expanded="false" aria-controls="controls">Instruments <span class="mono" id="instruments-summary"></span></button>
    <div class="controls" id="controls">
      <label>Assembler
        <select id="assembler"></select>
      </label>
      <label>Rendering
        <select id="variant">
          <option value="fixture">fixture-xml/v1 (compare)</option>
          <option value="messages">cwa-messages/v1 (model)</option>
        </select>
      </label>
      <label>budget.input
        <input id="budget" type="number" min="0" step="10" inputmode="numeric">
      </label>
      <button id="reset" type="button" title="Back to the frozen snapshot's budget">frozen</button>
      <span class="hint">← → switch steps</span>
    </div>
  </div>

  <section class="scenario" id="scenario"></section>
  <section class="delta" id="delta" aria-label="What changed since the previous step"></section>

  <main class="columns">
    <section class="column" id="candidates"><h2><span class="num">1</span><span class="col-title">Candidate context</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="decisions"><h2><span class="num">2</span><span class="col-title">CWA decisions</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="request"><h2><span class="num">3</span><span class="col-title">Outbound request</span><span class="col-sub"></span></h2><div class="body"></div></section>
    <section class="column" id="answer"><h2><span class="num">4</span><span class="col-title">Model answer</span><span class="col-sub"></span></h2><div class="body"></div></section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script type="module" src="/basic/page.js"></script>
</body>
</html>
